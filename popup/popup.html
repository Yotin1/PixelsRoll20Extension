<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="stylesheet" href="style.css" />
        <script src="script.js" defer></script>
    </head>
    <body>
        <p>Dice:</p>
        <input type="radio" name="dice" id="d4" value="4" />
        <label for="d4">D4</label>
        <input type="radio" name="dice" id="d6" value="6" />
        <label for="d6">D6</label>
        <input type="radio" name="dice" id="d8" value="8" />
        <label for="d8">D8</label>
        <input type="radio" name="dice" id="d10" value="10" />
        <label for="d10">D10</label>
        <input type="radio" name="dice" id="d12" value="12" />
        <label for="d12">D12</label>
        <input type="radio" name="dice" id="d20" value="20" />
        <label for="d20">D20</label>
        <input type="radio" name="dice" id="d100" value="100" />
        <label for="d100">D100</label>
        <br />

        <input type="radio" name="advantage" id="normal" value="normal" checked />
        <label for="normal">Normal</label>
        <input type="radio" name="advantage" id="advantage" value="advantage" />
        <label for="advantage">Advantage</label>
        <input type="radio" name="advantage" id="disadvantage" value="disadvantage" />
        <label for="disadvantage">Disadvantage</label>
        <br />

        <label for="number">Number of Rolls:</label><br />
        <input type="number" name="numRolls" id="numRolls" value="1" />
        <br />

        <label for="modifier">Modifier:</label><br />
        <input type="number" name="modifier" id="modifier" value="0" />
    </body>
</html>
